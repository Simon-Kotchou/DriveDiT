[project]
name = "drivedit"
version = "0.1.0"
description = "DriveDiT: diffusion-transformer world model for driving, plus its Enfusion capture tooling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Base dependencies are what the capture tooling needs (tools/validator, tools/harvester, data/dc2,
# drivedit_nav): stdlib, numpy and OpenCV. Nothing here may pull in torch; the capture-tests CI job
# runs without it.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.10.0.82,<4.11",
]

[project.optional-dependencies]
# The world-model side (layers/ blocks/ core/ models/ training/ inference/ ...).
# `uv sync --extra model` takes torch from PyPI (the CUDA build on Linux x86_64).
model = [
    "torch>=2.2",
    "einops>=0.7",
    "torchmetrics>=1.2",
    "tqdm>=4.65",
]
# Torch variant selectors, used together with `model`; they are mutually exclusive.
#   uv sync --extra model --extra cpu    # torch from the PyTorch CPU wheel index (CI)
#   uv sync --extra model --extra cuda   # torch from PyPI (same as `model` alone)
cpu = ["torch>=2.2"]
cuda = ["torch>=2.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.uv]
# Not installable yet: the code still lives in flat top-level folders (src/drivedit move comes later).
package = false
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "tools/test_deploy_addon.py", "tools/pin/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast unit test",
    "integration: crosses several components",
    "performance: timing or memory measurement",
    "benchmark: micro-benchmark",
    "slow: takes more than a few seconds",
    "torch: needs torch (the `model` extra); applied by tests/conftest.py (TORCH_TEST_MODULES, TORCH_TEST_IDS)",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness only, so the existing code passes without a mass cleanup: syntax errors (E9),
# format-string errors (F5, minus the cosmetic F541), comparison/assert/dict-key bugs (F6),
# misplaced statements (F7), undefined names (F82) and pylint errors (PLE). Widen in later PRs.
select = ["E9", "F5", "F6", "F7", "F82", "PLE"]
ignore = ["F541"]

[tool.ruff.lint.per-file-ignores]
# example_distributed_training() is a usage sketch with placeholder names (MyModel, MyDataset, ...).
"training/distributed.py" = ["F821"]
# DistillationTrainer uses ConsistencyTraining, which was never implemented (its import, from a
# blocks.flow_match module that never existed, was dropped in fb609ba). Tests using it are xfailed.
"training/distill.py" = ["F821"]
