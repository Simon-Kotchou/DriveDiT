# DriveDiT Unified Rust Workspace
# High-performance data loading and streaming for autonomous driving world model

[workspace]
resolver = "2"
members = [
    "drivedit-types",
    "drivedit-io",
    "drivedit-batch",
    "drivedit-streaming",
    "drivedit-py",
    "drivedit-bench",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["DriveDiT Team"]
license = "MIT"
repository = "https://github.com/drivedit/drivedit"
keywords = ["machine-learning", "autonomous-driving", "data-loading", "streaming"]
categories = ["science", "multimedia::images"]

[workspace.dependencies]
# Shared error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"

# Synchronization
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
simd-json = "0.13"

# Image processing
image = { version = "0.25", default-features = false }
fast_image_resize = { version = "4.0", features = ["image"] }

# Async runtime
tokio = { version = "1.40", features = ["full", "sync", "fs"] }
notify = "7.0"
notify-debouncer-mini = "0.5"

# Parallelism
rayon = "1.10"
ringbuf = "0.4"

# Memory
memmap2 = "0.9"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
aligned-vec = "0.5"

# Numerical
ndarray = "0.15"
ndarray-npy = "0.8"
nalgebra = "0.32"

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
numpy = "0.23"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"
rand = "0.8"

# Utilities
glob = "0.3"
bitflags = "2.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
