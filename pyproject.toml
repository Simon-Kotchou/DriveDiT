[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ruff writes a .ruff_cache next to each nested ruff.toml; keep it out of the sdist and the wheel.
source-exclude = ["**/.ruff_cache/**"]
wheel-exclude = ["**/.ruff_cache/**"]

[project]
name = "drivedit"
version = "0.1.0"
description = "DriveDiT: an action-conditioned world model of Arma Reforger driving, a policy trained inside it, and the Enfusion capture tooling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# Base dependencies are what the capture tooling needs (tools/validator, tools/harvester, data/dc2,
# drivedit_nav): stdlib, numpy and OpenCV. Nothing here may pull in torch; the capture-tests CI job
# runs without it.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.10.0.82,<4.11",
]

[project.scripts]
dd-encode = "drivedit.codec.encode:main"   # latent pre-encoder (DD-19); needs the model and codec extras
dd-train = "drivedit.train.cli:main"     # world-model training (DD-20); needs the model extra

[project.optional-dependencies]
# The world-model side. The March 2026 model stack was removed in DD-16 (tag archive/model-2026-03); these extras
# are kept for the model package that replaces it. Until then only tests/test_torch_smoke.py uses them.
# `uv sync --extra model` alone takes torch from PyPI (2.15.0+cu132 on Linux x86_64), which segfaults at CUDA init
# under WSL on this machine; use it with one of the selectors below.
model = [
    "torch>=2.2",
    "einops>=0.7",
    "torchmetrics>=1.2",
    "tqdm>=4.65",
]
# Torch variant selectors, used together with `model`; they are mutually exclusive.
#   uv sync --extra model --extra cpu    # torch from the PyTorch CPU wheel index (CI)
#   uv sync --extra model --extra cuda   # torch 2.14.1+cu130 from the PyTorch cu130 index, the newest build there.
#                                        # Verified on the local RTX 3080 Ti under WSL (DD-19, 2026-11-05); PyPI's
#                                        # 2.15.0+cu132 segfaults at torch.cuda.is_available() there.
cpu = ["torch>=2.2"]
cuda = ["torch>=2.2"]
# The frozen pretrained tokenizers of drivedit.codec (DD-19), used together with `model`. Weights are not packages:
# they download from the Hugging Face Hub at pinned revisions on first use, into HF_HOME. diffusers loads the FLUX.2
# and Wan2.1 VAEs. CADRE's autoencoder code is vendored (src/drivedit/codec/_vendor/cadre): pydantic is its config
# model and safetensors reads its checkpoint. DINOv3's code is a verified local checkout, not a dependency
# (drivedit.codec.dinov3).
codec = [
    "diffusers>=0.37",
    "huggingface-hub>=1.32",
    "pydantic>=2.10",
    "safetensors>=0.6",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.uv]
# The drivedit package lives in src/drivedit (uv_build). The capture tooling (tools/, data/dc2, drivedit_nav) still
# runs from the source tree until the package move (DD-17).
package = true
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "tools/test_deploy_addon.py", "tools/pin/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "torch: needs torch (the `model` extra); applied by tests/conftest.py (TORCH_TEST_MODULES)",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness only, so the existing code passes without a mass cleanup: syntax errors (E9),
# format-string errors (F5, minus the cosmetic F541), comparison/assert/dict-key bugs (F6),
# misplaced statements (F7), undefined names (F82) and pylint errors (PLE). Widen in later PRs.
select = ["E9", "F5", "F6", "F7", "F82", "PLE"]
ignore = ["F541"]

[tool.mypy]
# Strict typing for the drivedit package (DD-18); CI runs it in the torch job, where torch's own types are installed.
python_version = "3.11"
files = ["src/drivedit"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Vendored third-party code, kept close to upstream (src/drivedit/codec/_vendor): checked, but its own errors are not
# reported. Calls into it from drivedit are still checked against its annotations.
module = ["drivedit.codec._vendor.*"]
ignore_errors = true
