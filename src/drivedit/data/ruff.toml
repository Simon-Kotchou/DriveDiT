# drivedit.data is numpy-only: torch is banned here, except in data/torch.py (the thin Dataset over the shards).
extend = "../ruff.toml"

[lint.flake8-tidy-imports.banned-api]
"torch".msg = "drivedit.data is numpy-only; torch belongs in drivedit/data/torch.py"

[lint.per-file-ignores]
"./torch.py" = ["TID251"]  # only data/torch.py, not a nested torch.py

# isort would take `import torch` inside data/torch.py for a first-party import of that module itself.
[lint.isort]
known-third-party = ["torch"]
